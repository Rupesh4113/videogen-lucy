version: '3.8'

services:
  # 1. CPU Backend API & Production Orchestrator
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/videogen_db
      - REDIS_URL=redis://redis:6379/0
      - VIDEO_PROVIDER=simulation
      - VOICE_PROVIDER=edge_tts
      - STORAGE_PROVIDER=local
    volumes:
      - ./storage:/app/storage
    depends_on:
      - db
      - redis
    restart: unless-stopped

  # 2. Redis Message Broker & Job Queue
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  # 3. Managed PostgreSQL Database
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=videogen_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  # 4. Dedicated GPU Worker (PyTorch + CUDA + Wan2.1 + FFmpeg)
  gpu-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.gpu
    environment:
      - USE_CUDA=true
      - VIDEO_PROVIDER=wan_local
      - REDIS_URL=redis://redis:6379/0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ./storage:/app/storage
      - huggingface_cache:/root/.cache/huggingface
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  postgres_data:
  huggingface_cache:
