version: '3.8'

services:
  # Main App Server (CPU Backend + Web UI)
  videogen-app:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: videogen-production-app
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DEBUG=false
      - DATABASE_URL=sqlite+aiosqlite:///storage/videogen.db
      - VIDEO_PROVIDER=simulation  # Set to "wan_local" or "replicate"
      - VOICE_PROVIDER=edge_tts
      - STORAGE_PROVIDER=local
      - DEFAULT_RESOLUTION=1080p
      - DEFAULT_FPS=24
    volumes:
      - videogen_storage:/app/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - videogen-net

  # NGINX Reverse Proxy with SSL (Optional standalone proxy)
  nginx:
    image: nginx:alpine
    container_name: videogen-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_certs:/etc/letsencrypt
    depends_on:
      - videogen-app
    networks:
      - videogen-net

volumes:
  videogen_storage:
  certbot_certs:

networks:
  videogen-net:
    driver: bridge
